name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Wajib: Menghubungkan runner GitHub Actions ke jaringan privat Tailscale
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js application
        run: npm run build
        env:
          DATABASE_URL: "file:./dev.db"

      - name: Prepare deploy_temp directory
        run: |
          mkdir -p deploy_temp
          # Copy standalone build
          cp -a .next/standalone/. deploy_temp/
          # Copy static assets into standalone structure
          mkdir -p deploy_temp/.next/static
          cp -a .next/static/. deploy_temp/.next/static/
          # Copy public directory
          if [ -d "public" ]; then
            mkdir -p deploy_temp/public
            cp -a public/. deploy_temp/public/
          fi
          # Copy Prisma schema and package.json
          mkdir -p deploy_temp/prisma
          cp -a prisma/. deploy_temp/prisma/
          cp package.json deploy_temp/

      - name: Create tar.gz archive
        run: |
          tar -czf deploy.tar.gz -C deploy_temp .

      - name: Copy archive to server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP || '100.99.99.2' }}
          username: ${{ secrets.SERVER_USER || 'kenzo' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "deploy.tar.gz"
          target: "/var/www/testing-next"

      - name: Extract archive and restart systemd service via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_IP || '100.99.99.2' }}
          username: ${{ secrets.SERVER_USER || 'kenzo' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            cd /var/www/testing-next
            tar -xzf deploy.tar.gz
            rm -f deploy.tar.gz
            # Pastikan kepemilikan file dimiliki oleh user aplikasi filebrowser
            sudo chown -R filebrowser:filebrowser /var/www/testing-next
            # Restart service systemd next-app
            sudo systemctl restart next-app
